name: Build All Kernels (HyperOS & LineageOS)

on:
  workflow_dispatch:

jobs:
  build-hyperos:
    name: HyperOS Kernel (Android ${{ matrix.android_version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        android_version: [15, 16, 17]
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld git curl gcc-aarch64-linux-gnu

      - name: Clone HyperOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b xun-t-oss kernel-src

      - name: Inject KernelSU
        run: |
          cd kernel-src
          curl -LSs "https://raw.githubusercontent.com/twa2008/KernelSU/main/kernel/setup.sh" | bash - || true

      - name: Compile HyperOS Kernel
        run: |
          cd kernel-src
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          if [ -f "arch/arm64/configs/vendor/bengal_GKI.config" ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/bengal_GKI.config
          fi
          if [ -f "arch/arm64/configs/vendor/bengal_consolidate.config" ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/bengal_consolidate.config
          fi
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p $GITHUB_WORKSPACE/out_hyperos
          cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_hyperos/ || true

      - name: Upload HyperOS Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Kernel-Android-${{ matrix.android_version }}
          path: out_hyperos/

  build-lineage:
    name: LineageOS Kernel (Android ${{ matrix.android_version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        android_version: [15, 16, 17]
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld git curl gcc-aarch64-linux-gnu

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/therealmodder/android_kernel_xiaomi_bengal.git kernel-src || \
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b xun-t-oss kernel-src

      - name: Inject KernelSU
        run: |
          cd kernel-src
          curl -LSs "https://raw.githubusercontent.com/twa2008/KernelSU/main/kernel/setup.sh" | bash - || true

      - name: Compile LineageOS Kernel
        run: |
          cd kernel-src
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          if [ -f "arch/arm64/configs/vendor/bengal_GKI.config" ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/bengal_GKI.config
          fi
          if [ -f "arch/arm64/configs/vendor/bengal_consolidate.config" ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/bengal_consolidate.config
          fi
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config

          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p $GITHUB_WORKSPACE/out_lineage
          cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_lineage/ || true

      - name: Upload LineageOS Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Kernel-Android-${{ matrix.android_version }}
          path: out_lineage/
