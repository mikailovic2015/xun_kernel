name: Build All Kernels (Android 15, 16, 17)

on:
  workflow_dispatch:

jobs:
  build-a15:
    name: Build Kernel for Android 15
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo apt-get update && sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld git

      - name: Clone Kernel Source
        run: git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.xun-r-oss.git -b main kernel-src

      - name: Set up Clang
        run: mkdir toolchain && cd toolchain && wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.0/clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz && tar -xf clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz --strip-components=1

      - name: Compile Android 15 Kernel
        run: |
          cd kernel-src
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/xun_defconfig || make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/bengal-perf_defconfig
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p $GITHUB_WORKSPACE/out_a15 && cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_a15/

      - name: Upload Android 15 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android-15
          path: out_a15/

  build-a16:
    name: Build Kernel for Android 16
    needs: build-a15
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo apt-get update && sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld git

      - name: Clone Kernel Source
        run: git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.xun-r-oss.git -b main kernel-src

      - name: Set up Clang
        run: mkdir toolchain && cd toolchain && wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.0/clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz && tar -xf clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz --strip-components=1

      - name: Compile Android 16 Kernel
        run: |
          cd kernel-src
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/xun_defconfig || make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/bengal-perf_defconfig
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p $GITHUB_WORKSPACE/out_a16 && cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_a16/

      - name: Upload Android 16 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android-16
          path: out_a16/

  build-a17:
    name: Build Kernel for Android 17
    needs: build-a16
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo apt-get update && sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev clang lld git

      - name: Clone Kernel Source
        run: git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.xun-r-oss.git -b main kernel-src

      - name: Set up Clang
        run: mkdir toolchain && cd toolchain && wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.0/clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz && tar -xf clang+llvm-16.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz --strip-components=1

      - name: Compile Android 17 Kernel
        run: |
          cd kernel-src
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/xun_defconfig || make O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/bengal-perf_defconfig
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p $GITHUB_WORKSPACE/out_a17 && cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_a17/

      - name: Upload Android 17 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Android-17
          path: out_a17/
