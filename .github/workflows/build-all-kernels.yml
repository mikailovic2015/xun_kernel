name: Build All Kernels (HyperOS & LineageOS)

on:
  workflow_dispatch:

jobs:
  build-hyperos:
    name: HyperOS Kernel (Android ${{ matrix.android_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_version: [15, 16, 17]
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git curl gcc-aarch64-linux-gnu kmod rsync

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz | tar -xzC $GITHUB_WORKSPACE/clang

      - name: Clone HyperOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b xun-t-oss kernel-src

      - name: Inject KernelSU
        run: |
          cd kernel-src
          curl -LSs "https://raw.githubusercontent.com/twa2008/KernelSU/main/kernel/setup.sh" | bash - || true

      - name: Compile HyperOS Kernel
        run: |
          cd kernel-src
          chmod +x scripts/kconfig/* scripts/* || true
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Формируем конфигурацию
          cat arch/arm64/configs/gki_defconfig > merge_config.fragment
          [ -f "arch/arm64/configs/vendor/bengal_GKI.config" ] && cat arch/arm64/configs/vendor/bengal_GKI.config >> merge_config.fragment
          [ -f "arch/arm64/configs/vendor/bengal_consolidate.config" ] && cat arch/arm64/configs/vendor/bengal_consolidate.config >> merge_config.fragment || true

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCONFIG_ALLCONFIG=merge_config.fragment defconfig

          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config

          # Запуск сборки с явным логированием ошибок
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error" Image || make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error" Image

          mkdir -p $GITHUB_WORKSPACE/out_hyperos
          cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_hyperos/ || true

      - name: Upload HyperOS Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Kernel-Android-${{ matrix.android_version }}
          path: out_hyperos/

  build-lineage:
    name: LineageOS Kernel (Android ${{ matrix.android_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_version: [15, 16, 17]
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git curl gcc-aarch64-linux-gnu kmod rsync

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz | tar -xzC $GITHUB_WORKSPACE/clang

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/therealmodder/android_kernel_xiaomi_bengal.git kernel-src || \
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b xun-t-oss kernel-src

      - name: Inject KernelSU
        run: |
          cd kernel-src
          curl -LSs "https://raw.githubusercontent.com/twa2008/KernelSU/main/kernel/setup.sh" | bash - || true

      - name: Compile LineageOS Kernel
        run: |
          cd kernel-src
          chmod +x scripts/kconfig/* scripts/* || true
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          cat arch/arm64/configs/gki_defconfig > merge_config.fragment
          [ -f "arch/arm64/configs/vendor/bengal_GKI.config" ] && cat arch/arm64/configs/vendor/bengal_GKI.config >> merge_config.fragment
          [ -f "arch/arm64/configs/vendor/bengal_consolidate.config" ] && cat arch/arm64/configs/vendor/bengal_consolidate.config >> merge_config.fragment || true

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCONFIG_ALLCONFIG=merge_config.fragment defconfig

          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config

          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error" Image || make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w -Wno-error" Image

          mkdir -p $GITHUB_WORKSPACE/out_lineage
          cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/out_lineage/ || true

      - name: Upload LineageOS Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Kernel-Android-${{ matrix.android_version }}
          path: out_lineage/
